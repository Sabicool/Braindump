<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ground { fill: #fffff8; }
    .mark   { fill: #4a463c; }
    .cut    { fill: #fffff8; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #171613; }
      .mark   { fill: #cdc7b6; }
      .cut    { fill: #171613; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="6"/>
  <g class="mark">
    <!-- forewings: swept up and out to the corners -->
    <path d="M16 12.4 C19.4 7.6 25.2 4.4 28.4 6.2
             C31 7.7 29.6 13 25.2 16.4 C22.2 18.7 17.4 16.6 16 13.6 Z"/>
    <path d="M16 12.4 C12.6 7.6 6.8 4.4 3.6 6.2
             C1 7.7 2.4 13 6.8 16.4 C9.8 18.7 14.6 16.6 16 13.6 Z"/>
    <!-- hindwings: shorter, swept down and out -->
    <path d="M16 16 C19.2 17.4 22.6 20.2 23.2 23.8
             C23.7 27 20.4 28.6 18 26 C16.6 24.5 16 20.4 16 17.6 Z"/>
    <path d="M16 16 C12.8 17.4 9.4 20.2 8.8 23.8
             C8.3 27 11.6 28.6 14 26 C15.4 24.5 16 20.4 16 17.6 Z"/>
    <!-- body -->
    <path d="M16 8.2 C17.1 8.2 17.7 9.2 17.7 10.8
             C17.7 15.8 17.1 22.4 16 27.8
             C14.9 22.4 14.3 15.8 14.3 10.8
             C14.3 9.2 14.9 8.2 16 8.2 Z"/>
    <!-- antennae, swept back over the wings -->
    <path d="M15.2 9 C12.6 6.1 9.6 4.1 6.8 3.4 L6.4 4.9
             C8.9 5.6 11.6 7.4 14 10 Z"/>
    <path d="M16.8 9 C19.4 6.1 22.4 4.1 25.2 3.4 L25.6 4.9
             C23.1 5.6 20.4 7.4 18 10 Z"/>
  </g>
  <!-- the only cut detail: a wing bar each side and abdomen banding -->
  <g class="cut">
    <rect x="14.9" y="17.2" width="2.2" height="1" rx=".5"/>
    <rect x="15.1" y="20" width="1.8" height="1" rx=".5"/>
    <rect x="15.3" y="22.6" width="1.4" height=".9" rx=".45"/>
  </g>
</svg>
